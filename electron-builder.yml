appId: com.kaidamiani.downydownloader
productName: Downy Downloader
copyright: Copyright © 2026 Kai Damiani
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: vendor/bin
    to: bin
    filter:
      - "**/*"
      - "!versions.json"
      - "!.gitkeep"
  - from: vendor/licenses
    to: licenses
mac:
  category: public.app-category.video
  icon: build/icon.icns
  darkModeSupport: true
  minimumSystemVersion: "12.0"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  x64ArchFiles: "Contents/Resources/bin/*"
  target:
    - target: dir
      arch:
        - universal
  extendInfo:
    NSHumanReadableCopyright: "Copyright © 2026 Kai Damiani"
    NSHighResolutionCapable: true
dmg:
  title: "Downy ${version}"
  icon: build/icon.icns
  background: build/dmg-background.png
  iconSize: 96
  window:
    width: 660
    height: 420
  contents:
    - x: 165
      y: 195
      type: file
    - x: 495
      y: 195
      type: link
      path: /Applications
    - x: 330
      y: 335
      type: file
      path: build/FIRST LAUNCH.txt
      name: FIRST LAUNCH.txt
  artifactName: "Downy-Downloader-${version}-universal.dmg"
publish: null
